
<div
  class="fixed z-[60] bg-white rounded-xl shadow-dialog border border-gray-200
          py-1.5 min-w-[180px] animate-scale-in"
  [style.left.px]="data.x"
  [style.top.px]="data.y"
  (click)="$event.stopPropagation()">

  <button
    class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm font-sans
            text-brand hover:bg-brand-cream transition-colors"
    (click)="select('edit')">
    <app-fl-icon name="pencil" class="w-4 h-4 text-brand-gold" />
    Edit content
  </button>

  <div class="my-1 border-t border-gray-100"></div>

  <button
    class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm font-sans
            text-gray-400 hover:bg-gray-50 transition-colors"
    (click)="select(null)">
    <app-fl-icon name="x-mark" class="w-4 h-4" />
    Cancel
  </button>
</div>
