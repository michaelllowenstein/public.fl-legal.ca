
    <div
      #panel
      class="fixed z-[60] bg-white rounded-xl shadow-dialog border border-gray-100
             py-1.5 min-w-[180px] animate-scale-in"
      role="menu"
      aria-orientation="vertical"
      [style.left.px]="pos.x"
      [style.top.px]="pos.y"
      (click)="$event.stopPropagation()">
 
      @for (item of data.items; track item.label) {
        @if (item.divider) {
          <div class="my-1 border-t border-gray-100"></div>
        }
        <button
          class="w-full flex items-center gap-2.5 px-3.5 py-2 text-sm font-sans
                 transition-colors text-left"
          [class]="item.danger
            ? 'text-red-600 hover:bg-red-50'
            : 'text-brand hover:bg-brand-cream hover:text-brand-light'"
          role="menuitem"
          (click)="run(item)">
          @if (item.icon) {
            <app-fl-icon [name]="item.icon" class="w-4 h-4 shrink-0" />
          }
          {{ item.label }}
        </button>
      }
    </div>
