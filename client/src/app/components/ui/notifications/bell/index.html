
    <button
      class="bell-btn"
      [class.has-unread]="notifSvc.unreadCount() > 0"
      [class.active]="panelOpen()"
      (click)="togglePanel()"
      [attr.aria-label]="'Notifications' + (notifSvc.unreadCount() > 0 ? ' — ' + notifSvc.unreadCount() + ' unread' : '')"
      aria-haspopup="true"
      [attr.aria-expanded]="panelOpen()"
    >
      <!-- Bell SVG -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
 
      @if (notifSvc.unreadCount() > 0) {
        <span class="badge" aria-hidden="true">
          {{ notifSvc.unreadCount() > 99 ? '99+' : notifSvc.unreadCount() }}
        </span>
      }
    </button>
 
    @if (panelOpen()) {
      <app-notification-panel (close)="closePanel()" />
    }
